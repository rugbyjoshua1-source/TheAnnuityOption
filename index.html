function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function keyFor(section,group,label,index){return `${section}.${group}.${index}.${label}`}
function makeControl(field,key){const name=esc(key),val=data[key]??'';let out='';if(field.type==='radio'||field.type==='checkboxes'){out=`<div class="choices">${field.opts.map((o,i)=>{const id=`c_${btoa(unescape(encodeURIComponent(key+'_'+i))).replace(/[^a-zA-Z0-9]/g,'').slice(0,32)}`;const checked=field.type==='radio'?val===o:(Array.isArray(val)&&val.includes(o));return `<label class="choice"><input id="${id}" type="${field.type==='radio'?'radio':'checkbox'}" name="${name}" value="${esc(o)}" ${checked?'checked':''} data-key="${name}" data-kind="${field.type}"><span>${esc(o)}</span></label>`}).join('')}</div>`}else{let type=field.type==='select'?'select':field.type==='textarea'?'textarea':field.type==='month'?'month':field.type==='date'?'date':field.type==='email'?'email':field.type==='tel'?'tel':'text';if(type==='select')out=`<select class="control" data-key="${name}"><option value="">Select...</option>${field.opts.map(o=>`<option ${val===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;else if(type==='textarea')out=`<textarea class="control" data-key="${name}" placeholder="Type your answer">${esc(val)}</textarea>`;else out=`<input class="control" type="${type}" data-key="${name}" value="${esc(val)}" placeholder="${type==='month'?'MM/YYYY':''}">`}return out}
function renderFields(fields,section,group){return `<div class="fields">${fields.map((field,i)=>`<div class="field ${field.full?'full':''}"><label class="field-label">${esc(field.label)}</label>${makeControl(field,keyFor(section,group,field.label,i))}</div>`).join('')}</div>`}
function block(title,fields,section,group,intro=''){return `<section class="panel"><h2>${esc(title)}</h2>${intro?`<p class="panel-intro">${esc(intro)}</p>`:''}${renderFields(fields,section,group)}</section>`}
function renderSection(s){const head=`<div class="page-head"><div class="eyebrow">Retirement Health Form · ${String(current).padStart(2,'0')} / ${String(sections.length-1).padStart(2,'0')}</div><h1>${esc(s.title)}</h1><p>${esc(s.desc||'')}</p></div>`;let body='';
 if(s.kind==='welcome')return `<div class="welcome"><span class="tag">Enhanced annuity quotation request</span><h1>Let’s gather your health information.</h1><p>This guided form follows the Retirement Health Form supplied by your adviser. You can move through it at your own pace while this tab stays open.</p><div class="section-alert sensitive"><strong>Health information is sensitive.</strong> Answers remain in this open tab and are not saved in the browser or sent until you choose to submit them. When a secure receiving system is connected, the portal will forward your answers and clear its working copy after confirmation.</div><div class="welcome-grid"><div class="mini-card"><strong>14 guided sections</strong>Some sections may not apply to you.</div><div class="mini-card"><strong>Tab-only progress</strong>Closing or refreshing this tab clears your answers.</div><div class="mini-card"><strong>Review before sending</strong>Download a copy only if you want one.</div></div><p>Please answer accurately and give as much detail as you can. Providers may verify information with your doctor. Inaccurate answers can affect a quote or policy. The original form’s full privacy notice and consent wording should be read before submission.</p><label class="checkline"><input type="checkbox" data-key="start.confirm"> <span>I understand this website is a data-entry tool and does not submit my information yet.</span></label><p class="error" id="startErr">Please confirm before continuing.</p></div>`;
 if(s.id==='people'){body=block('Main applicant',profileFields,s.id,'main')+`<section class="panel"><h2>Dependant</h2><p class="panel-intro">Add a dependant if they are included in this annuity quotation.</p><label class="checkline"><input type="checkbox" id="depToggle" ${hasDep?'checked':''}><span>There is a dependant to include</span></label></section>`+(hasDep?block('Dependant details',profileFields,s.id,'dependant'):'');}
 else if(s.id==='lifestyle'){body=block('Main applicant',lifeFields,s.id,'main','Units of alcohol: one unit is about half a pint of normal-strength beer, one 125 ml glass of wine or one measure of spirits. Smoking here means tobacco; vaping, e-cigarettes, heated tobacco and nicotine replacement therapy are excluded.')+(hasDep?block('Dependant',lifeFields,s.id,'dependant'):'');}
 else if(s.id==='consent'){body=`<div class="section-alert sensitive"><strong>Important:</strong> The original PDF contains the full provider privacy notice and legal declaration. This web version summarises the input fields; read the supplied original pages 18-19 before signing or giving consent. Typed names below are not an electronic signature accepted by a provider.</div>`+block('Consent and declaration',consentFields,s.id,'main');}
 else if(s.id==='adviser')body=block('Financial adviser',adviserFields,s.id,'adviser');
 else if(s.id==='pension')body=block('Pension and annuity options',pensionFields,s.id,'pension');
 else if(s.id==='review')return `<div class="page-head"><div class="eyebrow">Retirement Health Form · Complete</div><h1>Review and download</h1><p>Check the answers, then send them securely to your adviser or keep a copy for your records.</p></div><div class="section-alert sensitive"><strong>Privacy reminder:</strong> Answers stay only in this open tab until submission. A downloaded answers file contains sensitive health information; keep it secure and delete it when finished.</div><div id="summary" class="panel"></div><div class="panel no-print"><h2>What would you like to do?</h2><p class="panel-intro">Your answers contain sensitive health information. This website has no secure submission service connected, so it cannot send the information directly yet.</p><div class="top-actions"><button class="btn primary" id="sendBtn" type="button">Send to adviser</button><button class="btn" id="downloadBtn" type="button">Download answers</button><button class="btn" id="printBtn" type="button">Print / Save as PDF</button></div><div id="sendNotice" class="section-alert sensitive hidden" role="status"><strong>Secure sending is not set up yet.</strong> Your answers have not been sent and remain in this browser. To share them, download the file and use a secure channel agreed with your adviser.</div></div><div class="actions no-print"><button class="btn" id="backBtn" type="button">← Back</button><span></span></div><p class="footer">No answers are emailed or uploaded by this website.</p>`;
 else {let fs=schemas[s.id]||[];const notices={medical:'For other conditions, record up to three here. If there are more, add details in the further information box.',heart:'Valve replacement does not include valve repair. Cardioversion and ablation are procedures used to treat heart rhythm problems.',diabetes:'HbA1c should be a laboratory reading, not a finger-prick, fasting glucose or CGM reading.',cancer:'Tumour grade is different from cancer stage. Include hospital letters or reports when your adviser requests them.',stroke:'Complete a separate questionnaire for each person if both applicant and dependant have had a stroke or TIA.',respiratory:'FEV1 refers to forced expiratory volume in one second, not peak flow.',ms:'Complete a separate questionnaire for each person if relevant.',neuro:'Complete a separate questionnaire for each person if relevant.',adl:'Choose the option that most closely describes current ability.'};body=`<div class="section-alert">${esc(notices[s.id]||'Complete this section if it applies to you. Leave it blank if it is not relevant.')}</div>`+block(s.title,fs,s.id,'main');}
 return head+body+`<div class="actions"><button class="btn" id="backBtn" type="button" ${current===0?'disabled':''}>← Back</button><div><button class="btn primary" id="nextBtn" type="button">${current===sections.length-1?'Finish':'Continue'} →</button></div></div><p class="footer">Retirement Health Form RHF-F 07/26 · Independent client data-entry website · No information is transmitted online.</p>`}
function renderNav(){document.getElementById('nav').innerHTML=sections.map((s,i)=>`<button type="button" class="nav-button ${i===current?'active':''} ${i<current?'done':''}" data-index="${i}"><span class="nav-number">${i<current?'✓':i+1}</span><span>${esc(s.short)}</span></button>`).join('');document.querySelectorAll('.nav-button').forEach(b=>b.onclick=()=>goto(+b.dataset.index));const pct=Math.round((current/(sections.length-1))*100);document.getElementById('progressFill').style.width=pct+'%';document.getElementById('progressPct').textContent=pct+'%';document.getElementById('progressLabel').textContent=current===0?'Getting started':`Section ${current} of ${sections.length-1}`}
function values(){const out={};document.querySelectorAll('[data-key]').forEach(el=>{const k=el.dataset.key;if(el.dataset.kind==='checkboxes'){out[k]=out[k]||[];if(el.checked)out[k].push(el.value)}else if(el.type==='checkbox')out[k]=el.checked;else if(el.type==='radio'){if(el.checked)out[k]=el.value}else out[k]=el.value});return out}
function save(){Object.assign(data,values());data.__hasDep=hasDep;const st=document.getElementById('saveStatus');if(st)st.textContent='Answers stay in this tab'}
function goto(i){save();current=Math.max(0,Math.min(sections.length-1,i));draw()}
function draw(){const app=document.getElementById('app');app.innerHTML=renderSection(sections[current]);renderNav();wire();window.scrollTo({top:0,behavior:'smooth'});if(sections[current].id==='review')renderSummary()}
function wire(){document.querySelectorAll('[data-key]').forEach(el=>{el.addEventListener('input',save);el.addEventListener('change',save)});const b=document.getElementById('backBtn');if(b)b.onclick=()=>goto(current-1);const n=document.getElementById('nextBtn');if(n)n.onclick=()=>{if(current===0&&!document.querySelector('[data-key="start.confirm"]')?.checked){document.getElementById('startErr').style.display='block';return}goto(current+1)};const dep=document.getElementById('depToggle');if(dep)dep.onchange=()=>{hasDep=dep.checked;save();draw()};const clr=document.getElementById('clearBtn');clr.onclick=()=>{if(confirm('Clear all answers from this tab? This cannot be undone.')){Object.keys(data).forEach(k=>delete data[k]);hasDep=false;current=0;draw()}};const db=document.getElementById('downloadBtn');if(db)db.onclick=download;const pb=document.getElementById('printBtn');if(pb)pb.onclick=()=>window.print();const sb=document.getElementById('sendBtn');if(sb)sb.onclick=()=>{const notice=document.getElementById('sendNotice');notice.classList.remove('hidden');notice.scrollIntoView({behavior:'smooth',block:'nearest'})}}
function pretty(k){return k.split('.').slice(3).join('.')||k}
function renderSummary(){const box=document.getElementById('summary');let html='';const activeKeys=Object.entries(data).filter(([k,v])=>!k.startsWith('__')&&v!==''&&v!==false&&(!Array.isArray(v)||v.length));for(const s of sections){if(s.id==='start'||s.id==='review')continue;const entries=activeKeys.filter(([k])=>k.startsWith(s.id+'.'));if(!entries.length)continue;html+=`<div class="summary-block"><h3>${esc(s.title)}</h3>${entries.map(([k,v])=>`<div class="summary-item"><span>${esc(pretty(k))}</span><strong>${esc(Array.isArray(v)?v.join(', '):String(v))}</strong></div>`).join('')}</div>`}box.innerHTML=html||'<p>No answers entered yet. Use Back to complete the relevant sections.</p>'}
function download(){save();const payload={form:'Retirement Health Form',version:'RHF-F 07/26',exportedAt:new Date().toISOString(),containsSensitiveHealthInformation:true,answers:Object.fromEntries(Object.entries(data).filter(([k])=>!k.startsWith('__')))};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='retirement-health-form-answers.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
draw();
</script>
